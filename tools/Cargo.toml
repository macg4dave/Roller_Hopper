[package]
name = "network-mapper-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
walkdir = "2.5.0"
regex = { version = "1.12.4", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
# Model evaluation only: heavy, so the hook's default build leaves it out. Keep the exact
# engine revision aligned with the app; v0.9.4 is not published on crates.io.
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "4400935451da5e2dc7379a3f92fbbada66557f6c", optional = true }
tokio = { version = "1.49.0", default-features = false, features = ["rt-multi-thread"], optional = true }

[target.'cfg(windows)'.dependencies]
# Finds MSVC's cl.exe for nvcc, as the cc crate does.
find-msvc-tools = "0.1.15"

[features]
ai = ["dep:mistralrs", "dep:tokio"]

# Protected: see docs/agents/rust.md and AGENTS.md "Protected files". Do not loosen without explicit user approval.
[lints.rust]
unsafe_code = "deny"  # not forbid: Slint generated code needs a local allow
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panics and placeholders
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
# Lint suppression must be explicit and justified: #[expect(lint, reason = "...")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Clarity and ownership
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
shadow_unrelated = "warn"
wildcard_enum_match_arm = "warn"
cognitive_complexity = "warn"
print_stdout = "warn"
print_stderr = "warn"
let_underscore_must_use = "warn"
mod_module_files = "warn"
