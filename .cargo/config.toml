[alias]
tool = "run --manifest-path tools/Cargo.toml --"

# The `cuda` feature finds the system CUDA install through CUDA_PATH and PATH, and MSVC's
# cl.exe through NVCC_CCBIN (see docs/building.md). On Windows nvcc also needs MSVC's
# conforming preprocessor for CUDA 13's headers, `/MD` to match Skia's C runtime, and
# `<string>` in every kernel because mistral.rs's Marlin kernels use `std::to_string`
# without it. A value already in the environment wins.
[env]
NVCC_APPEND_FLAGS = "-Xcompiler /Zc:preprocessor -Xcompiler /MD -include string"
