[package]
name = "network-mapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A local network mapper: real discovery scans, a hand-editable map, project files"
license = "MIT"
publish = false

[dependencies]
# Saves a project through a temporary file beside it, so a failed save keeps the old file.
atomic-write-file = "0.3.1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
dirs = "7.0.0"
ipnet = { version = "2.12.2", default-features = false, features = ["std", "serde"] }
# The scanner: ping sweep, neighbour table, mDNS names and TCP/UDP probes. Never `pcap`
# (needs a capture driver) or `db`.
netscli-core = { version = "0.3.4", default-features = false, features = ["mdns"] }
# The native Open and Save dialogs; on Linux through GTK3 (below), never a helper program.
rfd = { version = "0.17.2", default-features = false }
# Parses the bounded UPnP device descriptions that SSDP responders advertise.
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }
# The project file format.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
# Skia draws the scaled map (text, lines, icons) more cleanly than the default FemtoVG renderer.
# The window handle parents the file dialogs to the window.
slint = { version = "1.18.1", features = ["renderer-skia", "raw-window-handle-06"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
# The runtime a scan runs on, off the UI thread; netscli-core is async on Tokio.
tokio = { version = "1.54.0", default-features = false, features = ["rt-multi-thread"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
# Windows adapters with their router (gateway) addresses and real subnets.
ipconfig = { version = "0.3.4", default-features = false }

[build-dependencies]
slint-build = "1.18.1"

[features]
# NVIDIA CUDA is the normal app build; see docs/building.md for prerequisites.
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

# Protected: see docs/agents/rust.md and AGENTS.md "Protected files". Do not loosen without explicit user approval.
[lints.rust]
unsafe_code = "deny"  # not forbid: Slint generated code needs a local allow
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panics and placeholders
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
# Lint suppression must be explicit and justified: #[expect(lint, reason = "...")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Clarity and ownership
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
shadow_unrelated = "warn"
wildcard_enum_match_arm = "warn"
cognitive_complexity = "warn"
print_stdout = "warn"
print_stderr = "warn"
let_underscore_must_use = "warn"
mod_module_files = "warn"

[profile.release]
lto = "thin"
