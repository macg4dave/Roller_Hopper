[package]
name = "network-mapper"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "UI prototype of a local network mapper (mock data only)"
license = "MIT"
publish = false

[dependencies]
dirs = "7.0.0"
# mistralrs's tokenize takes the chat as Either::Left.
either = "1.19.0"
ipnet = { version = "2.12.2", default-features = false, features = ["std"] }
# The AI engine: loads any GGUF with its own tokenizer and chat template. v0.9.4 is pinned
# because it is not published on crates.io and includes the Windows CUDA detection fix.
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", rev = "4400935451da5e2dc7379a3f92fbbada66557f6c" }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
# Skia draws the scaled map (text, lines, icons) more cleanly than the default FemtoVG renderer.
slint = { version = "1.18.1", features = ["renderer-skia"] }
# mistralrs is async; the AI worker thread runs it on its own runtime.
tokio = { version = "1.49.0", default-features = false, features = ["rt-multi-thread"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[build-dependencies]
slint-build = "1.18.1"

[features]
# NVIDIA CUDA is the normal app build. Building it needs the system CUDA toolkit, cuDNN and
# MSVC; see docs/building.md.
default = ["cuda"]
cuda = ["mistralrs/cuda", "mistralrs/cudnn", "mistralrs/flash-attn"]

# Protected: see docs/agents/rust.md and AGENTS.md "Protected files". Do not loosen without explicit user approval.
[lints.rust]
unsafe_code = "deny"  # not forbid: Slint generated code needs a local allow
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panics and placeholders
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
# Lint suppression must be explicit and justified: #[expect(lint, reason = "...")]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Clarity and ownership
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
shadow_unrelated = "warn"
wildcard_enum_match_arm = "warn"
cognitive_complexity = "warn"
print_stdout = "warn"
print_stderr = "warn"
let_underscore_must_use = "warn"
mod_module_files = "warn"

[profile.release]
lto = "thin"
